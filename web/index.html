  <link rel="icon" type="image/png" href="favicon.png">

  <title>Aurum</title>
  <link rel="manifest" href="manifest.json">

  <style id="splash-screen-style">
    html, body {
      height: 100%;
      margin: 0;
      background-color: #000000;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #splash svg {
      width: 128px;
      height: 128px;
    }

    #ring {
      transform-origin: 50px 50px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    window.addEventListener('flutter-first-frame', () => {
      removeSplashFromWeb();
    });
  </script>
</head>
<body>
  <div id="splash">
    <svg viewBox="0 0 100 100" fill="none" stroke-width="12">
      <g id="ring">
        <!-- green, upper right -->
        <circle cx="50" cy="50" r="40" stroke="#10C98A"
                stroke-dasharray="55.8 195.5" transform="rotate(275 50 50)"/>
        <!-- green, lower right -->
        <circle cx="50" cy="50" r="40" stroke="#10C98A"
                stroke-dasharray="87.3 164" transform="rotate(5 50 50)"/>
        <!-- white, left -->
        <circle cx="50" cy="50" r="40" stroke="#FFFFFF"
                stroke-dasharray="87.3 164" transform="rotate(140 50 50)"/>
      </g>
      <!-- star stays still -->
      <polygon fill="#10C98A" stroke="none"
        points="50,36 53.3,45.5 63.3,45.7 55.3,51.7 58.2,61.3 50,55.6 41.8,61.3 44.7,51.7 36.7,45.7 46.7,45.5"/>
    </svg>
  </div>
