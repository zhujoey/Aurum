<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="useful tools for sports">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aurum">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Aurum</title>
  <link rel="manifest" href="manifest.json">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  
  <meta name="color-scheme" content="light dark">

  <script>
    (function() {
      const saved = localStorage.getItem('flutter.themeMode') || localStorage.getItem('themeMode') || localStorage.getItem('theme');
      if (saved) {
        const cleanTheme = saved.replace(/"/g, '').toLowerCase();
        if (cleanTheme.includes('light')) {
          document.documentElement.dataset.theme = 'light';
        } else if (cleanTheme.includes('dark')) {
          document.documentElement.dataset.theme = 'dark';
        }
      }
    })();
  </script>
  <style id="splash-screen-style">
    :root {
      --splash-bg: #000000;
      --splash-white: #FFFFFF;   /* the white ring arc */
      --splash-green: #10C98A;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --splash-bg: #FFFFFF;
        --splash-white: #000000; /* pure black on white background */
        --splash-green: #10B981;
      }
    }
    :root[data-theme="light"] {
      --splash-bg: #FFFFFF;
      --splash-white: #000000;
      --splash-green: #10B981;
    }
    :root[data-theme="dark"] {
      --splash-bg: #000000;
      --splash-white: #FFFFFF;
      --splash-green: #10C98A;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--splash-bg);
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--splash-bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #splash svg {
      width: 128px;
      height: 128px;
    }

    #ring {
      transform-box: view-box;
      transform-origin: 50px 50px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }

    window.addEventListener('flutter-first-frame', () => {
      removeSplashFromWeb();
    });
  </script>
</head>
<body>
  <div id="splash">
    <svg viewBox="0 0 100 100" fill="none" stroke-width="12">
      <g id="ring">
        <!-- green, upper right -->
        <circle cx="50" cy="50" r="40" stroke="var(--splash-green)"
                stroke-dasharray="55.8 195.5" transform="rotate(275 50 50)"/>
        <!-- green, lower right -->
        <circle cx="50" cy="50" r="40" stroke="var(--splash-green)"
                stroke-dasharray="87.3 164" transform="rotate(5 50 50)"/>
        <!-- white/gray, left -->
        <circle cx="50" cy="50" r="40" stroke="var(--splash-white)"
                stroke-dasharray="87.3 164" transform="rotate(140 50 50)"/>
      </g>
      <!-- star stays still -->
      <polygon fill="var(--splash-green)" stroke="none"
        points="50,36 53.3,45.5 63.3,45.7 55.3,51.7 58.2,61.3 50,55.6 41.8,61.3 44.7,51.7 36.7,45.7 46.7,45.5"/>
    </svg>
  </div>

</body></html>
